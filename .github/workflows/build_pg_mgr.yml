name: Build and Release pg_mgr

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-pg-mgr:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build pg_mgr for amd64
        run: |
          cd apps/pg_mgr
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X pg_mgr/cmd.Version=${{ github.ref_name }}" -o ../../pg_mgr-linux-amd64 .

      - name: Build pg_mgr for arm64
        run: |
          cd apps/pg_mgr
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X pg_mgr/cmd.Version=${{ github.ref_name }}" -o ../../pg_mgr-linux-arm64 .

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pg_mgr-linux-amd64
            pg_mgr-linux-arm64
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: PESQL ${{ github.ref_name }}
          draft: false
          prerelease: false
